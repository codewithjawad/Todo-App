name: Flutter iOS Build

on:
  push:
    branches:
      - main    # Trigger on push to the main branch (can be changed as per your workflow)
  pull_request:
    branches:
      - main    # Trigger on pull request to the main branch (can be changed as per your workflow)

jobs:
  build:
    runs-on: macos-latest  # Use macOS runner to build iOS app

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.0'  # Set your Flutter version

      - name: Install dependencies
        run: |
          flutter pub get
          sudo gem install cocoapods # Required for iOS dependencies

      - name: Build iOS app
        run: flutter build ios --release  # Builds the iOS app for release (use --debug for debug build)

      - name: Archive iOS app
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner archive -archivePath ${{ github.workspace }}/build/Runner.xcarchive
          xcodebuild -exportArchive -archivePath ${{ github.workspace }}/build/Runner.xcarchive -exportPath ${{ github.workspace }}/build -exportOptionsPlist ios/Runner/ExportOptions.plist

      - name: Upload iOS Build Artifact (IPA)
        uses: actions/upload-artifact@v3
        with:
          name: ios-build
          path: ${{ github.workspace }}/build/*.ipa  # Path to the IPA file you want to download
