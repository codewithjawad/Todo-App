name: Flutter iOS Build

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.1'

      - name: Install dependencies
        run: |
          flutter pub get
          sudo gem install cocoapods
          cd ios && pod install

      - name: Build iOS app
        run: flutter build ios --release

      - name: Archive iOS app
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner archive -archivePath ${{ github.workspace }}/build/Runner.xcarchive
          xcodebuild -exportArchive -archivePath ${{ github.workspace }}/build/Runner.xcarchive -exportPath ${{ github.workspace }}/build -exportOptionsPlist ios/Runner/ExportOptions.plist

      - name: Upload iOS Build Artifact (IPA)
        uses: actions/upload-artifact@v3
        with:
          name: ios-build
          path: ${{ github.workspace }}/build/*.ipa